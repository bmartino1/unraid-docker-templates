# Immich PostgreSQL 18 — Unraid-oriented Docker Compose reference
# Derived from templates/immich-postgress.xml (read-only source). Not a replacement for Community Applications.
# Review ALL paths, ports and credentials before starting.
# Matches current Unraid XML PostgreSQL 18 image, HOST mode and /var/lib/postgresql/data mount. Verify PG18 / PGDATA migration guidance and backup before replacing any existing DB; password deliberately blank. Pair with matching Immich version. Do not start against older data directory without migration.
name: unraid-immich-postgress
services:
  app:
    image: "ghcr.io/immich-app/postgres:18-vectorchord1.1.1-pgvector0.8.5"
    restart: "unless-stopped"
    network_mode: host
    hostname: postgres
    dns:
      - 8.8.8.8
    pids_limit: 2048
    volumes:
      - "/mnt/user/appdata/postgresql_immich:/var/lib/postgresql/data:rw"
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "immich"
      PGDATA: "/var/lib/postgresql/data"
